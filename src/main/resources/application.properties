spring.application.name=aulaviva-api

# --- Banco de dados (PostgreSQL por padrão; use as variáveis de ambiente para trocar) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aulaviva}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Upload (limite de 25 MB, que é também o limite da API de transcrição) ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# --- Timeouts das chamadas HTTP à API de IA ---
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=5m

# --- Armazenamento de arquivos ---
aulaviva.storage.audio-dir=uploads/audio
aulaviva.storage.image-dir=uploads/images

# --- Integração com IA (a chave vem SEMPRE de variável de ambiente) ---
aulaviva.ai.api-key=${AI_API_KEY:}
aulaviva.ai.base-url=https://api.groq.com/openai/v1
aulaviva.ai.transcription-model=whisper-large-v3
aulaviva.ai.summary-model=qwen/qwen3.8-27b
aulaviva.ai.language=pt
aulaviva.ai.max-images=3
