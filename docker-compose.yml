# Opcional: sobe um PostgreSQL local com as credenciais padrão do application.properties
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aulaviva
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
